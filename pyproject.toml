[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardv2"
version = "0.1.0"
description = "Build high-resolution Hearthstone card images from existing low-resolution renders"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=9.4",
]

[project.optional-dependencies]
upscale = ["torch>=2.1", "spandrel>=0.3"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
cardv2 = "cardv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
